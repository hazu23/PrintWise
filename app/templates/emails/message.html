<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f3f6f8;font-family:Arial,Helvetica,sans-serif;color:#0a2e45;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d3dde5;border-radius:8px;">
    <tr><td style="padding:24px 28px 8px 28px;">
      <p style="margin:0 0 16px 0;font-size:20px;font-weight:bold;">PrintWise</p>
      <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.25;">{{ heading }}</h1>
      {% for line in lines %}<p style="margin:0 0 12px 0;font-size:15px;line-height:1.5;">{{ line }}</p>{% endfor %}
    </td></tr>
    {% if button_url %}
    <tr><td style="padding:8px 28px 24px 28px;">
      <a href="{{ button_url }}" style="display:inline-block;background:#00709f;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:6px;">{{ button_label }}</a>
      <p style="margin:16px 0 0 0;font-size:12px;color:#53677a;word-break:break-all;">If the button does not work, copy this link into your browser:<br>{{ button_url }}</p>
    </td></tr>
    {% endif %}
  </table>
</body>
</html>
