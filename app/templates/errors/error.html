{% extends "layouts/public.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container pw-auth">
  <div class="pw-auth__card text-center">
    <p class="pw-display fs-1 mb-1">{{ code }}</p>
    <h1 class="h3">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <div class="d-flex justify-content-center gap-2">
      <a class="btn btn-primary" href="{{ url_for(current_user.home_endpoint()) if current_user else url_for('public.index') }}">{{ "Go to your dashboard" if current_user else "Go to the home page" }}</a>
    </div>
  </div>
</div>
{% endblock %}
